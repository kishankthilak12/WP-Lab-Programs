<!DOCTYPE html>
<htm>
<head>
<title>Predefine Functions in JavaScript</title>
</head>
<body>
	
	<h2>JavaScript String and Math Functions</h2>
	
	<script>
		let text="Hello World";
		document.write("<h3>String Functions</h3>");
		document.write("Original String : "+text+"<br>");
		document.write("Length of the String : "+text.length+"<br>");
		document.write("Original String : "+text+"<br>");
		document.write("Uppercase : "+text.toUpperCase()+"<br>");
		document.write("Lowercase : "+text.toLowerCase()+"<br>");
		
		document.write("Character at position 1 :  "+text.charAt(2)+"<br>");
		document.write("Position of World : "+text.indexOf("World")+"<br>");
		
		let n=57.9;
		document.write("<h3>Math Functions</h3>");
		document.write("Number : "+n+"<br>");
		document.write("Round : "+Math.round(n)+"<br>");
		document.write("Ceiling : "+Math.ceil(n)+"<br>");
		document.write("Floor : "+Math.floor(n)+"<br>");
		document.write("Square Root : "+Math.sqrt(n)+"<br>");
		document.write("Power : "+Math.pow(2,3)+"<br>");
		document.write("Absolute Value : "+Math.abs(-10)+"<br>");
		
	</script>
</body>
</html>
