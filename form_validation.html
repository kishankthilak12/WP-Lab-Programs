<!DOCTYPE html>
<html>
<head>
<title>Registration form</title>
<style>
	body{
		position:absolute;
		top:50%;
		left:50%;
		transform:translate(-50%,-50%);
	}
</style>
</head>
</head>
<body>
<h1>Registration Form</h1>
<form name="regform" onsubmit="return validationform()" >
	<label for="fname">First Name : </label><br>
	<input type="text" id="fname" name="fname"><br>
	<br>
	
	<label for="lname">Last Name : </label><br>
	<input type="text" id="lname" name="lname" ><br>
	<br>
	
	<label for="mob">Mobile NUmber : </label><br>
	<input type="number" id="mob" name="mob" ><br>
	<br>
	
	<label for="password">Password : </label><br>
	<input type="passsword" id="password" name="password"><br>
	<br>
	
	<label for="confirmpassword">Password : </label><br>
	<input type="passsword" id="confirmpassword" name="confirmpassword"><br>
	<br>
	
	<button type="submit">Submit</button>
</form>
<script>
	functipn validateform(){
		var errors="";
		var fname=document.getElementById("fname").value;
		var lname=document.getElementById("lname").value;
		var mob=document.getElementById("mob").value;
		var password=document.getElementById("password").value;
		var confirmpassword=document.getElementById("confirmpassword").value;
		if(fname.trim()==""){
			errors+="First name is required\n";
		}
		if(lname.trim()==""){
			errors+="Last name is required\n";
		}
		var mobilepattern=/^[0-9]{10}$/;
		if(!mobilepattern.test(mob){
			errors+="Enter valid 10 digit mobile number\n";
		}
		if(password.lenght<8){
			errors+="Password must be atkeast 8 characters\n";
		}
		if(password!=confirmpassword){
			errors+="Password do not match\n";
		}
		
		if(errors!=""){
			alert("Please fix the follwoing errors :\n\n"+erros);
			return false;
		}
		alert("Registration Successfull!");
		return false;
	}
</script>	

</body>
</html>
